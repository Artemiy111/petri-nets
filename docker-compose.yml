name: petri-nets

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: timed-petri-nets:latest
    container_name: petri-nets
    restart: unless-stopped
    init: true
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-lgtm:4318}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-petri-nets}
      OTEL_ENVIRONMENT: ${OTEL_ENVIRONMENT:-local}
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-local}
      OTEL_TRACES_SAMPLE_RATE: ${OTEL_TRACES_SAMPLE_RATE:-1}
      OTEL_BROWSER_SAMPLE_RATE: ${OTEL_BROWSER_SAMPLE_RATE:-}
    depends_on:
      - otel-lgtm
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  otel-lgtm:
    image: grafana/otel-lgtm:0.38.1
    container_name: petri-nets-otel
    restart: unless-stopped
    ports:
      - "${OTEL_UI_PORT:-3001}:3000"
      - "4317:4317"
      - "4318:4318"
